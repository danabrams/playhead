# SwiftLint configuration for Playhead — playhead-ia2s
#
# ─────────────────────────────────────────────────────────────────────────────
# DESIGN RULE: THE BASELINE IS GREEN. IT STAYS GREEN.
# ─────────────────────────────────────────────────────────────────────────────
# A linter that is permanently red protects nothing — everyone learns to
# ignore it and real regressions ride in behind the noise. So this config was
# built by MEASUREMENT, not by taste: every rule below was run against the
# whole tree (1,174 tracked Swift files; 1,120 linted after the exclusions
# below drop vendored source) and admitted only at a violation count of
# EXACTLY ZERO. Nothing was reformatted to get here; no `swiftlint --fix`
# sweep was ever run. `scripts/lint.sh` therefore passes on a clean checkout,
# which means any violation you see is one YOU just introduced.
#
# Rules that fire today are NOT disabled quietly — they are listed at the
# bottom of this file with their measured counts. That list is the roadmap:
# each entry is a follow-up bead, not a permanent surrender.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY `only_rules` AND NOT `disabled_rules`
# ─────────────────────────────────────────────────────────────────────────────
# `disabled_rules` means "SwiftLint's defaults, minus these". Every SwiftLint
# upgrade that ships a new default rule would then silently turn the gate red
# on a branch that changed nothing. `only_rules` inverts that: the enabled set
# is exactly what is written here, upgrades are inert, and adopting a new rule
# is a deliberate, measured edit. The cost is that genuinely good new default
# rules must be opted into by hand — that is the intended trade.
#
# ─────────────────────────────────────────────────────────────────────────────
# WARNINGS VS ERRORS
# ─────────────────────────────────────────────────────────────────────────────
# Every rule here is `warning` severity (SwiftLint's per-rule default severity
# is deliberately overridden where it would otherwise be `error`). That is on
# purpose:
#
#   * Bare `swiftlint lint` — what Xcode and editor integrations run — exits 0
#     and paints yellow. Lint never blocks an unrelated build.
#   * `scripts/lint.sh` runs with `--strict`, which promotes every warning to
#     an error for exit-code purposes. That is the gate. Because the baseline
#     is 0 violations, zero-tolerance costs nothing and catches everything.
#
# PROMOTION TO `error` (per rule, deliberate, one at a time):
#   A rule graduates from `warning` to `error` when BOTH hold:
#     1. it has stayed at zero violations across a full release cycle, and
#     2. its violations are always genuine defects, never a matter of taste.
#   Promoting it means it bites even WITHOUT `--strict` — i.e. inside Xcode and
#   for anyone running bare `swiftlint`. Do not promote style rules; a style
#   rule that hard-errors in the IDE is how linters get uninstalled.
#
# PROMOTION OF A DECLINED RULE (bottom of file) TO ENABLED:
#   Only via a dedicated bead that drives its count to zero with reviewed,
#   intentional edits. Never by a bulk `swiftlint --fix` sweep: a repo-wide
#   reformat destroys `git blame` and collides with every open bead branch.
#
# ─────────────────────────────────────────────────────────────────────────────
# RUNNING IT
# ─────────────────────────────────────────────────────────────────────────────
#   scripts/lint.sh                 # the gate — strict, whole repo, ~6s
#   scripts/lint.sh --changed       # only files changed vs the merge-base
#   scripts/lint.sh path/to/File.swift
#
# NOTE: SwiftLint needs a real toolchain for SourceKit. This box's global
# `xcode-select` points at CommandLineTools, which has none — bare `swiftlint`
# dies with "Loading sourcekitdInProc.framework ... failed". `scripts/lint.sh`
# exports DEVELOPER_DIR for you; that is the main reason to use it.

# ─────────────────────────────────────────────────────────────────────────────
# EXCLUSIONS — generated, vendored, or not-ours
# ─────────────────────────────────────────────────────────────────────────────
excluded:
  # xcodegen-generated from project.yml. Never hand-edited, never linted.
  - Playhead.xcodeproj
  # Third-party vendored SPM package (own LICENSE + Package.swift). 54 Swift
  # files we do not author and must not restyle.
  - Vendor
  # Bundled specialist model weights, staged out-of-git by
  # scripts/fetch-specialist-model.sh. Not source.
  - Playhead/Resources/Models
  # Corpus fixtures: audio, transcripts, annotations, snapshots. Data, not code.
  - TestFixtures
  # Build/test caches. `.derivedData` is what every bead worktree writes into,
  # and it contains copied-in sources that would be linted twice.
  # GLOBS, not literals. Device/dogfood builds write per-run derived-data dirs
  # whose names are not fixed — observed in the primary checkout on 2026-07-29:
  # `.derivedData`, `.derivedDataDevice`, `.deriveddata-b6jq-device`. Only the
  # first was listed, so a single device build left ~10k violations behind in
  # vendored SPM checkouts (swift-atomics' autogenerated AtomicsFolding.swift,
  # swift-huggingface, …) and turned `scripts/lint.sh` red on a CLEAN tree.
  # The failure message — "The baseline is green, so this is in your diff" — is
  # then exactly backwards and sends you hunting through your own changes.
  # A literal list cannot keep up with per-run suffixes, so match the prefix.
  # Both cases are spelled out because SwiftLint's glob matching is
  # case-sensitive even where the filesystem is not.
  - .derivedData*
  - .deriveddata*
  - DerivedData*
  - build
  - .build
  # Nested bead worktrees — each is a full checkout; linting them would
  # multiply every count by the number of open beads.
  - .worktrees
  - .claude
  # Generated icon renders (no Swift today; excluded so a future generator
  # dropping a .swift here cannot turn the gate red).
  - design/icon/renders

# ─────────────────────────────────────────────────────────────────────────────
# ENABLED RULES — every one measured at 0 violations on this tree
# ─────────────────────────────────────────────────────────────────────────────
only_rules:
  # ── Likely-bug / correctness ───────────────────────────────────────────────
  # These are the reason the linter exists. Playhead is actor-heavy and
  # notification-heavy; `unhandled_throwing_task` and the NotificationCenter
  # pair in particular catch defect classes that a human reviewer routinely
  # misses in a large diff.
  - block_based_kvo
  - class_delegate_protocol
  - compiler_protocol_init
  - deployment_target
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - invisible_character
  - lower_acl_than_parent
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - overridden_super_call
  - override_in_extension
  - private_unit_test
  - prohibited_super_call
  - redundant_sendable
  - return_value_from_void_function
  - self_in_property_initialization
  - unhandled_throwing_task
  - unused_control_flow_label
  - unused_setter_value

  # ── Dead code / redundancy ─────────────────────────────────────────────────
  # The bead's stated motivation: dead code lands unreviewed. `unneeded_override`
  # and `empty_xctest_method` are the load-bearing two — an empty XCTest method
  # is a test that silently asserts nothing.
  - duplicate_imports
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_xctest_method
  - no_fallthrough_only
  - redundant_objc_attribute
  - redundant_set_access_control
  - syntactic_sugar
  - trailing_semicolon
  - unneeded_override
  - unused_enumerated
  - void_function_in_ternary

  # ── Idiom, already universally followed here ───────────────────────────────
  - discouraged_assert
  - explicit_init
  - fallthrough
  - fatal_error_message
  - joined_default_parameter
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - reduce_boolean
  - self_binding
  - static_operator
  - untyped_error_in_catch

  # ── Performance idioms (all already clean) ─────────────────────────────────
  - contains_over_filter_count
  - flatmap_over_map_reduce
  - last_where
  - reduce_into

  # ── Legacy-API guards ──────────────────────────────────────────────────────
  # Zero cost today; their whole job is to stop a regression sneaking in from
  # a Stack Overflow paste.
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - legacy_uigraphics_function

  # ── Formatting the codebase already gets right on all 1,120 linted files ───
  # Enabling these locks in the convention that is ALREADY here. Note what is
  # absent: line_length, indentation_width, opening/contrasted brace style,
  # multiline_* — those fight the real conventions of this repo and are in the
  # DECLINED list with their counts.
  - attribute_name_spacing
  - closing_brace
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - comment_spacing
  - computed_accessors_order
  - function_name_whitespace
  - generic_type_name
  - implicit_getter
  - leading_whitespace
  - literal_expression_end_indentation
  - multiple_closures_with_trailing_closure
  - no_space_in_method_call
  - protocol_property_accessors_order
  - return_arrow_whitespace
  - switch_case_alignment
  - trailing_whitespace
  - vertical_parameter_alignment
  - void_return
  - xctfail_message
  - yoda_condition

  # ── Lint hygiene about the linter itself ───────────────────────────────────
  # `blanket_disable_command` stops `// swiftlint:disable foo` with no matching
  # `enable`. `invalid_swiftlint_command` catches typo'd directives that would
  # otherwise silently do nothing.
  # `superfluous_disable_command` deletes disable comments that no longer
  # suppress anything, so the suppressions in the tree stay honest.
  #
  # Six files already carry `// swiftlint:disable:next force_try | force_cast |
  # nesting | optional_data_string_conversion` — written before this config
  # existed, for rules it does not (yet) enable. MEASURED: the rule does not
  # flag them; SwiftLint only evaluates disable commands for rules that are
  # actually enabled, so those comments sit inert and start working for free
  # the day their rule is adopted. They are kept, not deleted.
  - blanket_disable_command
  - invalid_swiftlint_command
  - superfluous_disable_command

# ─────────────────────────────────────────────────────────────────────────────
# PER-RULE CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
# Everything enabled above is `warning`. Several of these rules ship with an
# `error` default severity; they are pinned down here so that bare
# `swiftlint lint` stays advisory and only `scripts/lint.sh --strict` gates.
# See the PROMOTION TO `error` criterion at the top before changing any of these.
block_based_kvo:
  severity: warning
class_delegate_protocol:
  severity: warning
compiler_protocol_init:
  severity: warning
duplicate_conditions:
  severity: warning
duplicate_enum_cases:
  severity: warning
duplicated_key_in_dictionary_literal:
  severity: warning
dynamic_inline:
  severity: warning
invalid_swiftlint_command:
  severity: warning
invisible_character:
  severity: warning
ns_number_init_as_function_reference:
  severity: warning
nsobject_prefer_isequal:
  severity: warning
private_unit_test:
  severity: warning
self_in_property_initialization:
  severity: warning
unused_setter_value:
  severity: warning

# `deployment_target` reads the minimum OS from the build settings and flags
# `@available` checks that can never be false. Playhead's floor moves (iOS 26 →
# 27, playhead-xx7m), so this rule is how stale availability guards get found
# after a floor raise instead of accumulating forever.
deployment_target:
  severity: warning

# NOTE ON THRESHOLDS: there are none in this file, on purpose. The threshold
# rules — file_length, type_body_length, function_body_length, line_length,
# identifier_name, cyclomatic_complexity, function_parameter_count — are all in
# the DECLINED list. Playhead has 5,000-line test files, long-lived actor types,
# and deliberately verbose test names; picking a threshold that this tree passes
# today would mean picking one so high it never fires, which is a rule that only
# pretends to work. They stay off until a bead decides what the real budget is.

